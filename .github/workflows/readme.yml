name: Update README

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/generate-apps-table.sh"

permissions: {}

jobs:
  update-apps-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate applications table
        run: |
          chmod +x scripts/generate-apps-table.sh
          ./scripts/generate-apps-table.sh

      - name: Stage readme changes
        run: git add readme.md

      - name: Commit readme changes
        uses: xxczaki/actions/commit-via-api@2055f70b487aac8d86315ce4eb26028931f60cd6 # v1.0.0
        with:
          token: ${{ github.token }}
          message: "docs: update applications table in readme"
