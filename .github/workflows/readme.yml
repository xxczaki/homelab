name: Update README

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/generate-apps-table.sh"

permissions: {}

jobs:
  update-apps-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate applications table
        run: |
          chmod +x scripts/generate-apps-table.sh
          ./scripts/generate-apps-table.sh

      - name: Commit readme changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add readme.md
          if git diff --cached --quiet; then
            echo "Applications table already up to date"
            exit 0
          fi
          .github/scripts/commit-via-api.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "docs: update applications table in readme"
