name: Sync Tailscale ACLs

on:
  push:
    branches: ["main"]
    paths: ["policy.hujson", ".github/workflows/tailscale.yml"]
  pull_request:
    branches: ["main"]
    paths: ["policy.hujson", ".github/workflows/tailscale.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  tailscale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ACL
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ vars.TS_WIF_TEST_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_TEST_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test

      - name: Apply ACL
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ vars.TS_WIF_APPLY_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_APPLY_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply
