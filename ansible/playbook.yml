- name: Configure K3s node
  hosts: raspberrypi
  become: true
  vars:
    # --- Network ---
    k3s_node_ip: "10.10.10.10,fe80::c196:2a41:e1c0:79d7"
    k3s_tls_san: "100.67.31.43"
    k3s_cluster_cidrs:
      - "10.42.0.0/16"
      - "2001:cafe:42::/56"
    k3s_service_cidrs:
      - "10.43.0.0/16"
      - "2001:cafe:43::/112"

    # --- Cluster DNS upstreams ---
    # CoreDNS forwards to the kubelet resolv.conf. The host one points at UniFi, which forwards to
    # Cloudflare. Cloudflare's txl01 PoP intermittently answers github.com with SERVFAIL (EDE 22,
    # "No Reachable Authority"), so pods query Quad9 and Google directly (kubelet keeps at most 3).
    k3s_resolv_conf: /etc/rancher/k3s/resolv.conf
    k3s_upstream_nameservers:
      - "9.9.9.9"
      - "2620:fe::fe"
      - "8.8.8.8"

    # --- API Server ---
    k3s_apiserver_args:
      - "enable-admission-plugins=NodeRestriction"
      - "admission-control-config-file=/var/lib/rancher/k3s/server/psa.yaml"

    # --- Controller Manager ---
    k3s_controller_manager_args:
      - "terminated-pod-gc-threshold=10"

    # --- Kubelet ---
    k3s_kubelet_args:
      - "streaming-connection-idle-timeout=5m"
      - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
      - "image-gc-high-threshold=60"
      - "image-gc-low-threshold=40"

    # --- Pod Security Admission ---
    psa_default_level: "restricted"
    psa_exempt_namespaces:
      - kube-system
      - pi-hole
      - tailscale
      - monitoring
      - longhorn
      - default
      - cilium-test-1
      - system-upgrade

    # --- Sysctl: kubelet requirements (protect-kernel-defaults) ---
    sysctl_kubelet:
      vm.panic_on_oom: 0
      vm.overcommit_memory: 1
      kernel.panic: 10
      kernel.panic_on_oops: 1

    # --- Sysctl: kubernetes extras ---
    sysctl_kubernetes:
      fs.inotify.max_user_watches: 524288
      fs.inotify.max_user_instances: 512

    # --- Kata Containers (VM-isolated pods, RuntimeClass in apps/kata) ---
    kata_version: "4.2.0"
    kata_sha256: "5dd4e9f2d5ea9e6bdfa2f476b3315335b58252366fcda2775a3094fc8fec376b"
    kata_dir: /opt/kata
    kata_config_dir: "{{ kata_dir }}/share/defaults/kata-containers/runtime-rs"
    kata_default_memory_mb: 256

    # --- Boot ---
    boot_cmdline: "console=serial0,115200 console=tty1 root=PARTUUID=3e6aa092-02 rootfstype=ext4 fsck.repair=yes rootwait cgroup_memory=1 cgroup_enable=memory cfg80211.ieee80211_regdom=PL"

  tasks:
    - name: Create K3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Deploy K3s config
      tags: dns
      ansible.builtin.template:
        src: templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
      notify: restart K3s

    - name: Deploy cluster DNS resolv.conf
      tags: dns
      ansible.builtin.template:
        src: templates/k3s-resolv.conf.j2
        dest: "{{ k3s_resolv_conf }}"
        mode: "0644"
      notify:
        - restart K3s
        - restart CoreDNS

    - name: Deploy Pod Security Admission config
      ansible.builtin.template:
        src: templates/psa.yaml.j2
        dest: /var/lib/rancher/k3s/server/psa.yaml
        mode: "0644"
      notify: restart K3s

    - name: Deploy kubelet sysctl config
      ansible.builtin.template:
        src: templates/sysctl-kubelet.conf.j2
        dest: /etc/sysctl.d/90-kubelet.conf
        mode: "0644"
      notify: reload sysctl

    - name: Deploy kubernetes sysctl config
      ansible.builtin.template:
        src: templates/sysctl-kubernetes.conf.j2
        dest: /etc/sysctl.d/91-kubernetes.conf
        mode: "0644"
      notify: reload sysctl

    - name: Check installed Kata Containers version
      tags: kata
      ansible.builtin.stat:
        path: "{{ kata_dir }}/.version-{{ kata_version }}"
      register: kata_installed

    - name: Install Kata Containers
      tags: kata
      when: not kata_installed.stat.exists
      notify: restart K3s
      block:
        - name: Download Kata Containers
          ansible.builtin.get_url:
            url: "https://github.com/kata-containers/kata-containers/releases/download/{{ kata_version }}/kata-static-{{ kata_version }}-arm64.tar.zst"
            dest: /tmp/kata-static.tar.zst
            checksum: "sha256:{{ kata_sha256 }}"
            mode: "0600"

        - name: Remove previous Kata Containers
          ansible.builtin.file:
            path: "{{ kata_dir }}"
            state: absent

        - name: Extract Kata Containers
          ansible.builtin.command:
            cmd: tar --zstd -xf /tmp/kata-static.tar.zst -C /
          changed_when: true

        - name: Mark Kata Containers version
          ansible.builtin.file:
            path: "{{ kata_dir }}/.version-{{ kata_version }}"
            state: touch
            mode: "0644"
      always:
        - name: Remove Kata Containers download
          ansible.builtin.file:
            path: /tmp/kata-static.tar.zst
            state: absent

    - name: Create Kata config drop-in directory
      tags: kata
      ansible.builtin.file:
        path: "{{ kata_config_dir }}/config.d"
        state: directory
        mode: "0755"

    - name: Deploy Kata config overrides
      tags: kata
      ansible.builtin.template:
        src: templates/kata-overrides.toml.j2
        dest: "{{ kata_config_dir }}/config.d/50-homelab.toml"
        mode: "0644"

    - name: Create containerd drop-in directory
      tags: kata
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
        state: directory
        mode: "0755"

    - name: Register Kata runtime with containerd
      tags: kata
      ansible.builtin.template:
        src: templates/kata-containerd.toml.j2
        dest: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/kata.toml
        mode: "0644"
      notify: restart K3s

    - name: Deploy boot cmdline
      ansible.builtin.template:
        src: templates/cmdline.txt.j2
        dest: /boot/firmware/cmdline.txt
        mode: "0755"
      notify: reboot required

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Print reboot notice
      ansible.builtin.debug:
        msg: "Boot cmdline changed – a reboot is required for changes to take effect."
      when: reboot_needed is defined and reboot_needed

  handlers:
    - name: restart K3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: restart CoreDNS
      ansible.builtin.command:
        cmd: k3s kubectl -n kube-system rollout restart deployment/coredns
      register: coredns_restart
      until: coredns_restart.rc == 0
      retries: 12
      delay: 10
      changed_when: true

    - name: reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system

    - name: reboot required
      ansible.builtin.set_fact:
        reboot_needed: true
