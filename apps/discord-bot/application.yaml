apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discord-bot
  namespace: discord-bot
spec:
  project: default
  source:
    repoURL: https://github.com/xxczaki/discord-bot.git
    path: deploy/chart
    targetRevision: 9406152c0cbb4278c900ae033818bd2590d88f53
    helm:
      valuesObject:
        image:
          tag: 9406152c0cbb4278c900ae033818bd2590d88f53
        secrets:
          token:
            name: secrets
            key: token
          sentryDsn:
            name: secrets
            key: sentryDsn
          spotifyClientSecret:
            name: secrets
            key: spotifyClientSecret
          openAiApiKey:
            name: secrets
            key: openAiApiKey
          mistralApiKey:
            name: secrets
            key: mistralApiKey
        env:
          clientId: "767113441718435850"
          botDebugChannelId: "1378037693094694922"
          guilds:
            "824396697558843432":
              playlistsChannelId: "1197942961695101090"
              ownerRoleId: "1490074399632789624"
            "1430907046907084915":
              playlistsChannelId: "1565400229413392606"
          spotifyClientId: "cb115f7736cd45c9a7e8ae4555fa0f83"
          enableYoutube: "true"
        persistentVolumeClaim:
          storageClass: longhorn
          size: 20Gi
        redis:
          architecture: standalone
          auth:
            enabled: false
          master:
            resources:
              requests:
                memory: "48Mi"
                cpu: "25m"
              limits:
                memory: "128Mi"
                cpu: "100m"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: discord-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
