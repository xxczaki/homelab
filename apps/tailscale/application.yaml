apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  project: default
  source:
    chart: tailscale-operator
    repoURL: https://pkgs.tailscale.com/helmcharts
    targetRevision: 1.104.7
    helm:
      valuesObject:
        # Workload identity federation: the operator exchanges a projected
        # ServiceAccount token (issuer https://xxczaki.github.io/homelab, see
        # oidc/) for short-lived Tailscale API tokens instead of using an
        # OAuth client secret.
        oauth:
          clientId: TvcUD9N8ES11CNTRL-krkU4ikcgG11CNTRL
          audience: api.tailscale.com/TvcUD9N8ES11CNTRL-krkU4ikcgG11CNTRL
        apiServerProxyConfig:
          mode: "true"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
