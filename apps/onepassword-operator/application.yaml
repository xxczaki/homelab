apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-operator
  namespace: argo-cd
spec:
  project: default
  source:
    chart: connect
    repoURL: https://1password.github.io/connect-helm-charts
    targetRevision: 2.4.2
    helm:
      valuesObject:
        connect:
          create: false
        operator:
          create: true
          authMethod: service-account
          # The 1Password account allows 1,000 reads a day across all service accounts.
          # The default 600 s poll costs 144 reads per item a day, which ran it out at 9 items.
          pollingInterval: 3600
          serviceAccountToken:
            name: onepassword-service-account-token
            key: token
          watchNamespace:
            - wicek
  destination:
    server: "https://kubernetes.default.svc"
    namespace: onepassword
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
