apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wicek-chart
  namespace: wicek
spec:
  project: default
  source:
    chart: wicek
    repoURL: https://xxczaki.github.io/charts/
    targetRevision: 0.1.323
    helm:
      valuesObject:
        secrets:
          oauthToken:
            name: wicek-secrets
            key: CLAUDE_CODE_OAUTH_TOKEN
          discordToken:
            name: wicek-secrets
            key: DISCORD_BOT_TOKEN
          githubWebhookSecret:
            name: wicek-secrets
            key: GITHUB_WEBHOOK_SECRET
          grafanaWebhookToken:
            name: wicek-secrets
            key: GRAFANA_WEBHOOK_TOKEN
        ssh:
          knownHosts: |
            homeassistant.wicek.svc.cluster.local ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICKsBnZ2z0mLWXvv5Lw49EpfT8ycLZbURlKeM3x32e79
            homeassistant.wicek.svc.cluster.local ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGVy/wM8DDh+iiZx6OBKUUxXNpK4qa4kpbA7biqNHQx88BZPtQ01QSSWzZGdRAaRSszyMI4P1qgjLcKp3lpRhi0=
            homeassistant.wicek.svc.cluster.local ssh-rsa 
            raspberrypi.wicek.svc.cluster.local ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICdBq66LTw3mPbR+Popxqt43fYZo9fDaH/SQA5Osg8H
            raspberrypi.wicek.svc.cluster.local ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEYw/dQ/aIaRfch2Qy59miJ6y705cmcxBLbbGmPOOE5B6H1+HHgFIuWFz/x3gq1E6dwWESiQbYyQcFj4X+NglTI=
            raspberrypi.wicek.svc.cluster.local ssh-rsa 
        env:
          clientId: "1479530749354053833"
          allowedUserIds: "349213466743013376"
        persistence:
          storageClass: longhorn
        chromium:
          enabled: true
        webhooks:
          service:
            enabled: true
          ingress:
            enabled: true
            hostname: wicek-webhooks
            funnel: true
        networkPolicy:
          extraEgressPorts: [993]
        readersDefaults:
          memory: 512Mi
          callbackBaseUrl: https://wicek-webhooks.tail12a84.ts.net
        readers:
          - name: bank
            description: "The user's C24 bank accounts: balances and transactions (read-only). Ask it first about spending, costs, and balances. Also connects or renews the bank link."
            prompt: |
              # C24 bank accounts via Enable Banking

              Read-only PSD2 access to the user's C24 accounts. Base URL https://api.enablebanking.com, JSON in and out.

              ## Session

              /state/session.json holds `{"session_id", "valid_until", "accounts": [{"uid", "iban", "name"}]}`. If it's missing or expired, or a call returns 401/403 or a consent error, connect:

              1. `GET /aspsps?country=DE` and take the entry named `C24`. Its `maximum_consent_validity` is in seconds.
              2. Create a random state and save it as described in your rules, then `POST /auth` with `{"access": {"valid_until": "<now + maximum_consent_validity, ISO 8601>"}, "aspsp": {"name": "C24", "country": "DE"}, "state": "<that state>", "redirect_url": "<your callback URL>", "psu_type": "personal"}`. Answer with the returned `url` and tell the user to open it and log in – the result arrives in Discord on its own.
              3. When the redirect comes back with a `code`: `POST /sessions` with `{"code": "<code>"}`. Save `session_id`, `access.valid_until`, and each account's `uid`, `account_id.iban`, and `name` to /state/session.json, and confirm which accounts are connected. If it came back with an `error` instead, explain it.

              If `valid_until` is within 7 days, mention it in every answer.

              ## Data

              - Balances: `GET /accounts/{uid}/balances`
              - Transactions: `GET /accounts/{uid}/transactions?date_from=YYYY-MM-DD[&date_to=YYYY-MM-DD]`. Repeat with `&continuation_key=<key>` until the response has none.
              - Transaction fields: `booking_date` (else `value_date`), `transaction_amount.amount` and `.currency`, `credit_debit_indicator` (`DBIT` money out, `CRDT` money in), `creditor.name` / `debtor.name`, `remittance_information[]`, `status` (`BOOK` booked, `PDNG` pending).

              Banks allow only about 4 unattended calls per account per day. Fetch the whole range you need at once into /tmp/cache/<uid>-<today>.json and reuse it for the rest of the day. Never write transaction data under /state.

              Do totals and grouping with jq, not by hand.
            hosts:
              - host: api.enablebanking.com
                methods: [GET, POST]
                auth:
                  type: enable-banking
                  applicationIdFile: /run/broker/enable-banking/username
                  privateKeyFile: /run/broker/enable-banking/credential
            secrets:
              - name: enable-banking
                secretName: enable-banking
        broker:
          enabled: true
          secrets:
            - name: grafana-cloud
              secretName: grafana-cloud
            - name: home-assistant
              secretName: home-assistant
            - name: unifi
              secretName: unifi
            - name: github
              secretName: github
            - name: icloud
              secretName: icloud
            - name: home-assistant-ssh
              secretName: home-assistant-ssh
            - name: wicek-logins
              secretName: wicek-logins
          hosts:
            - host: parsify.grafana.net
              auth:
                type: bearer
                tokenFile: /run/broker/grafana-cloud/credential
            - host: homeassistant.wicek.svc.cluster.local
              auth:
                type: home-assistant
                tokenFile: /run/broker/home-assistant/credential
            - host: 10.10.10.1
              insecureTls: true
              methods: [GET, POST]
              auth:
                type: unifi
                usernameFile: /run/broker/unifi/username
                passwordFile: /run/broker/unifi/password
            - host: api.github.com
              auth:
                type: bearer
                tokenFile: /run/broker/github/credential
            - host: uploads.github.com
              auth:
                type: bearer
                tokenFile: /run/broker/github/credential
            - host: github.com
              auth:
                type: basic
                username: x-access-token
                passwordFile: /run/broker/github/credential
            - host: gist.github.com
              auth:
                type: basic
                username: x-access-token
                passwordFile: /run/broker/github/credential
            - host: "*.icloud.com"
              auth:
                type: basic
                usernameFile: /run/broker/icloud/username
                passwordFile: /run/broker/icloud/password
            - host: imap.broker
              methods: [GET]
              auth:
                type: imap
                server: imap.mail.me.com
                usernameFile: /run/broker/icloud/username
                passwordFile: /run/broker/icloud/password
            - host: logins.broker
              methods: [GET]
              auth:
                type: logins
                vault: Wicek Logins
                tokenFile: /run/broker/wicek-logins/credential
                mailServer: imap.mail.me.com
                mailUsernameFile: /run/broker/icloud/username
                mailPasswordFile: /run/broker/icloud/password
          sshKeys:
            - /run/broker/home-assistant-ssh/private-key
  destination:
    server: "https://kubernetes.default.svc"
    namespace: wicek
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
