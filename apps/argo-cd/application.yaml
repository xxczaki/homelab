apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argo-cd
spec:
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.18.3
    helm:
      valuesObject:
        global:
          networkPolicy:
            # Keep the Argo CD component boundary explicit.
            create: true

        configs:
          params:
            server.insecure: true
            application.namespaces: discord-bot, tailscale, pi-hole, monitoring, longhorn, kube-system, system-upgrade, wicek
          secret:
            createSecret: false
          cm:
            timeout.reconciliation: 0s
            url: https://argo-cd.tail12a84.ts.net
            # SSO through tsidp (apps/tsidp). Admins get the argocd-admins
            # group claim from the tailscale.com/cap/tsidp grant in policy.hujson.
            # tsidp tokens live 5 minutes, so refresh well before that.
            oidc.config: |
              name: Tailscale
              issuer: https://idp.tail12a84.ts.net
              clientID: 911e3e59c8dcc1dbe71088f7d607efd3
              clientSecret: $oidc.tsidp.clientSecret
              requestedScopes: ["openid", "profile", "email"]
              enablePKCEAuthentication: true
              refreshTokenThreshold: 60s
          rbac:
            policy.default: ""
            scopes: "[groups, email]"
            policy.csv: |
              g, argocd-admins, role:admin

        controller:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi

        dex:
          enabled: false

        applicationSet:
          replicas: 0

        redis:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi

        repoServer:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi

        notifications:
          enabled: false

        server:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          extraArgs:
            - --enable-gzip
          ingress:
            enabled: true
            ingressClassName: tailscale
            hostname: argo-cd
            hosts:
              - argo-cd
            extraTls:
              - hosts:
                - argo-cd
            https: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
